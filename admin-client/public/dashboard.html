<!doctype html>
<html>
  <head>
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="./css/dashboard.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  </head>
  <body>
    <div class="container">
      <div class="form-card">
        <h2>Create Player</h2>
        <input type="text" id="username" placeholder="Username" />
        <input type="email" id="email" placeholder="Email" />
        <input type="password" id="password" placeholder="Password" />
        <button onclick="createPlayer()">Create Player</button>
      </div>

      <div id="globalStats" class="form-card hidden" style="margin-bottom: 20px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
          <h2 style="margin: 0; color: #1e3a8a;">Global Summary (Cohort)</h2>
          <button onclick="exportGlobalExcel()" style="padding: 10px 20px; background: #10b981; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 8px;">
            <svg style="width:18px;height:18px;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
            Export Global Data (Excel)
          </button>
        </div>
        <div id="globalStatsContent" style="display: flex; gap: 15px; flex-wrap: wrap;"></div>
      </div>

      <h2>Players List</h2>
      <div class="players-controls">
        <span>Sort by:</span>
        <button id="sortScoreBtn" type="button">Score</button>
        <button id="sortTimeBtn" type="button">Time</button>
        <button id="sortCreatedBtn" type="button">Created</button>
      </div>
      <table>
        <thead>
          <tr>
            <th>Username</th>
            <th>Email</th>
            <th>Score</th>
            <th>Time (s)</th>
            <th>Created At</th>
          </tr>
        </thead>
        <tbody id="playersTable"></tbody>
      </table>

    <div id="playerDetails" class="player-details hidden">
        <h2>Player Details</h2>
        <div id="detailsContent"></div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script type="module" src="./js/dashboard.js"></script>
  </body>
</html>
