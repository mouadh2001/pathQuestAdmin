<!doctype html>
<html>
  <head>
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="./css/dashboard.css" />
  </head>
  <body>
    <div class="container">
      <div class="form-card">
        <h2>Create Player</h2>
        <input type="text" id="username" placeholder="Username" />
        <input type="email" id="email" placeholder="Email" />
        <input type="password" id="password" placeholder="Password" />
        <button onclick="createPlayer()">Create Player</button>
      </div>

      <h2>Players List</h2>
      <div class="players-controls">
        <span>Sort by:</span>
        <button id="sortScoreBtn" type="button">Score</button>
        <button id="sortTimeBtn" type="button">Time</button>
        <button id="sortCreatedBtn" type="button">Created</button>
      </div>
      <table>
        <thead>
          <tr>
            <th>Username</th>
            <th>Email</th>
            <th>Score</th>
            <th>Time (s)</th>
            <th>Created At</th>
          </tr>
        </thead>
        <tbody id="playersTable"></tbody>
      </table>

      <div id="playerDetails" class="player-details hidden">
        <h2>Player Details</h2>
        <div id="detailsContent"></div>
      </div>
    </div>

    <script type="module" src="./js/dashboard.js"></script>
  </body>
</html>
